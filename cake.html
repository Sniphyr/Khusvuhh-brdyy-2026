<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎂 Make a Wish</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Georgia', serif;
    background: #0a0612;
    color: #fff;
    touch-action: none;
  }

  #scene {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 0;
  }

  /* Background */
  #bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 60%, #1a0a2e 0%, #0a0612 70%);
    transition: filter 0.8s ease;
    z-index: 0;
  }
  #bg.dim { filter: brightness(0.4); }
  #bg::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
  }

  /* Fairy Lights */
  #fairy-lights {
    position: absolute; top: 0; left: 0; right: 0;
    height: 6vh;
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    padding-top: 0.5vh;
    z-index: 2;
    transition: filter 1s ease;
  }
  #fairy-lights.bright { filter: brightness(2) saturate(1.5); }
  .wire {
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, rgba(255,220,100,0.3), transparent);
  }
  .bulb {
    width: clamp(6px, 1.2vw, 12px);
    height: clamp(9px, 1.8vw, 18px);
    border-radius: 50% 50% 40% 40%;
    position: relative;
    animation: bulbFlicker var(--dur, 3s) ease-in-out infinite alternate;
    box-shadow: 0 0 clamp(4px,1vw,10px) var(--col), 0 0 clamp(8px,2vw,20px) var(--col);
  }
  .bulb::before {
    content: '';
    position: absolute; top: -3px; left: 50%; transform: translateX(-50%);
    width: 3px; height: 5px;
    background: rgba(180,180,180,0.4);
    border-radius: 2px 2px 0 0;
  }
  @keyframes bulbFlicker {
    0%   { opacity: 0.7; }
    50%  { opacity: 1; }
    100% { opacity: 0.5; }
  }

  /* Particles */
  #particles { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: var(--pc, rgba(180,120,255,0.4));
    animation: floatUp var(--pd, 8s) linear infinite;
    width: var(--ps, 4px); height: var(--ps, 4px);
    left: var(--px, 50%); bottom: -10px; opacity: 0;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) scale(1); }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.4; }
    100% { opacity: 0; transform: translateY(-105vh) scale(0.3); }
  }

  /* Stars */
  .star {
    position: absolute; width: 2px; height: 2px;
    background: #fff; border-radius: 50%;
    animation: twinkle var(--sd, 4s) ease-in-out infinite alternate;
    opacity: 0.6;
  }
  @keyframes twinkle {
    0%   { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 1;   transform: scale(1.4); }
  }

  /* Balloons */
  .balloon {
    position: absolute;
    width: clamp(30px, 5vw, 60px);
    height: clamp(38px, 6.5vw, 76px);
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    animation: sway var(--bsw, 4s) ease-in-out infinite alternate;
    z-index: 2; opacity: 0.85;
  }
  .balloon::after {
    content: '';
    position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
    width: 1px; height: clamp(20px, 4vh, 50px);
    background: rgba(255,255,255,0.35);
  }
  @keyframes sway {
    0%   { transform: rotate(-6deg) translateY(0); }
    100% { transform: rotate(6deg) translateY(-8px); }
  }
  .balloon.float-up { animation: floatAway 2.5s ease-in forwards; }
  @keyframes floatAway {
    0%   { transform: translateY(0) rotate(0); opacity: 0.85; }
    100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
  }

  /* Header */
  #header {
    position: relative; z-index: 10;
    text-align: center;
    margin-bottom: clamp(12px, 3vh, 32px);
    user-select: none;
  }
  #heading {
    font-size: clamp(1.5rem, 4.5vw, 3.2rem);
    background: linear-gradient(135deg, #f5c842, #e08cff, #f5c842);
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite;
    letter-spacing: 0.04em; line-height: 1.2;
  }
  @keyframes shimmer {
    0%   { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  #subtitle {
    margin-top: 0.5em;
    font-size: clamp(0.75rem, 1.8vw, 1.1rem);
    color: rgba(220,190,255,0.8);
    letter-spacing: 0.06em; font-style: italic;
  }
  #candle-hint {
    margin-top: 0.6em;
    font-size: clamp(0.65rem, 1.4vw, 0.85rem);
    color: rgba(255,210,100,0.75);
    letter-spacing: 0.08em;
    animation: hintPulse 2s ease-in-out infinite alternate;
  }
  @keyframes hintPulse {
    0%   { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* Cake Section */
  #cake-section {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    margin-top: clamp(18px, 3.5vh, 38px);
    animation: cakeFloat 3.6s ease-in-out infinite;
  }
  @keyframes cakeFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }
  #cake-section.bounce { animation: cakeBounce 0.6s cubic-bezier(.36,.07,.19,.97); }
  @keyframes cakeBounce {
    0%,100% { transform: translateY(0); }
    20%  { transform: translateY(-20px); }
    40%  { transform: translateY(4px); }
    60%  { transform: translateY(-12px); }
    80%  { transform: translateY(2px); }
  }

  #cake-wrap {
    width: clamp(160px, 28vw, 320px);
    height: auto; position: relative;
    filter: drop-shadow(0 20px 40px rgba(180,100,255,0.35));
  }

  /* Candle & Flame */
  #candle-group {
    position: absolute; top: 0; left: 50%;
    transform: translate(-50%, -100%) translateY(18px);
  }
  #candle-body {
    width: clamp(8px,1.4vw,16px);
    height: clamp(22px,4vw,44px);
    background: linear-gradient(to right, #ffe8a0, #fffde7, #f5c842, #fffde7);
    border-radius: 3px 3px 1px 1px;
    margin: 0 auto; position: relative;
    box-shadow: 0 2px 8px rgba(245,200,66,0.3);
  }
  #candle-body::after {
    content: '';
    position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
    width: 2px; height: 6px; background: #555; border-radius: 1px;
  }
  #flame-wrap {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    cursor: pointer; z-index: 20;
    padding: clamp(8px,2vw,16px); margin-bottom: -8px;
  }
  #flame {
    width: clamp(14px,2.5vw,26px); height: clamp(22px,4vw,40px);
    position: relative; margin: 0 auto;
    transition: opacity 0.8s ease;
  }
  .flame-inner {
    position: absolute; left: 50%; bottom: 0;
    transform: translateX(-50%);
    border-radius: 50% 50% 20% 20%;
    transform-origin: bottom center;
  }
  .flame-outer {
    width: clamp(14px,2.5vw,26px); height: clamp(22px,4vw,40px);
    background: radial-gradient(ellipse at 50% 80%, #fff700 0%, #ff9500 40%, #ff4800 75%, transparent 100%);
    animation: flicker 0.15s ease-in-out infinite alternate;
  }
  .flame-mid {
    width: clamp(8px,1.4vw,16px); height: clamp(14px,2.5vw,26px);
    bottom: 2px;
    background: radial-gradient(ellipse at 50% 80%, #fff 0%, #ffe066 60%, transparent 100%);
    animation: flickerMid 0.2s ease-in-out infinite alternate;
  }
  .flame-glow {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: clamp(30px,6vw,60px); height: clamp(30px,6vw,60px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,200,50,0.45) 0%, transparent 70%);
    animation: glowPulse 1.2s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes flicker {
    0%   { transform: translateX(-50%) scaleX(1)   scaleY(1)    rotate(-2deg); }
    33%  { transform: translateX(-50%) scaleX(0.9) scaleY(1.05) rotate(1deg); }
    66%  { transform: translateX(-50%) scaleX(1.1) scaleY(0.95) rotate(-1deg); }
    100% { transform: translateX(-50%) scaleX(1)   scaleY(1.08) rotate(2deg); }
  }
  @keyframes flickerMid {
    0%   { transform: translateX(-50%) scaleX(1)   rotate(1deg); }
    100% { transform: translateX(-50%) scaleX(0.85) rotate(-2deg); }
  }
  @keyframes glowPulse {
    0%   { opacity: 0.6; transform: translateX(-50%) scale(1); }
    100% { opacity: 1;   transform: translateX(-50%) scale(1.3); }
  }
  #flame.out { opacity: 0; pointer-events: none; }

  /* Smoke */
  #smoke {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    display: none; flex-direction: column; align-items: center; pointer-events: none;
  }
  #smoke.show { display: flex; }
  .smoke-puff {
    width: clamp(6px,1.2vw,14px); height: clamp(6px,1.2vw,14px);
    border-radius: 50%; background: rgba(220,220,220,0.55);
    margin: 2px 0;
    animation: smokeDrift 1.5s ease-out forwards;
    animation-delay: var(--sd2, 0s); opacity: 0;
  }
  @keyframes smokeDrift {
    0%   { opacity: 0.8; transform: translateY(0) translateX(0) scale(1); }
    100% { opacity: 0;   transform: translateY(-40px) translateX(var(--dx, 5px)) scale(2.5); }
  }

  /* Cake Stand */
  #cake-stand {
    width: clamp(140px,25vw,280px); height: clamp(10px,1.5vw,18px);
    background: linear-gradient(to right, #c9a84c, #f5e090, #c9a84c);
    border-radius: 50%;
    box-shadow: 0 4px 16px rgba(180,140,0,0.45), 0 8px 30px rgba(0,0,0,0.5);
    margin-top: 4px;
  }

  /* Confetti */
  #confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .confetto {
    position: absolute;
    opacity: 0;
    animation: confettoFall var(--cf-dur, 2.5s) ease-in var(--cf-del, 0s) forwards;
    border-radius: var(--cf-r, 2px);
    background: var(--cf-col, #f5c842);
  }
  @keyframes confettoFall {
    0%   { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(110vh) rotate(var(--cf-rot, 720deg)) scale(0.6); }
  }

  /* Sparkles */
  #sparkle-container { position: fixed; inset: 0; pointer-events: none; z-index: 51; overflow: hidden; }
  .sparkle {
    position: absolute; opacity: 0;
    animation: sparkleAnim var(--sp-dur, 1.2s) ease-out var(--sp-del, 0s) forwards;
    background: var(--sp-col, #f5c842);
    clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  }
  @keyframes sparkleAnim {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--sp-dx,30px),var(--sp-dy,-60px)) scale(0.2); }
  }

  /* Wish Message */
  #wish-msg {
    position: relative; z-index: 12;
    margin-top: clamp(12px, 2.5vh, 28px);
    text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s ease, transform 0.8s ease;
    transform: translateY(10px);
  }
  #wish-msg.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  #wish-msg h2 {
    font-size: clamp(1.1rem, 3vw, 2rem);
    background: linear-gradient(135deg, #f5c842, #e08cff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite; background-size: 200% auto;
  }

  /* ═══════════════════════════════════════════
     KITKAT MODAL — centered, below wish text
  ═══════════════════════════════════════════ */
  #kitkat-modal {
    position: fixed; inset: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #kitkat-modal.show { opacity: 1; pointer-events: auto; }

  /* semi-dark backdrop blur */
  #kitkat-modal::before {
    content: '';
    position: absolute; inset: 0;
    background: rgba(5,2,15,0.55);
    backdrop-filter: blur(3px);
  }

  #kitkat-card {
    position: relative;
    background: linear-gradient(145deg, #160826, #220d3a);
    border: 1px solid rgba(224,140,255,0.3);
    border-radius: 24px;
    padding: clamp(20px,3.5vw,36px) clamp(24px,4vw,44px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 12px 50px rgba(140,60,255,0.4),
      0 0 80px rgba(160,80,255,0.15);
    width: min(90vw, 380px);
    text-align: center;
    overflow: hidden;
    animation: none;
    transform: translateY(30px) scale(0.92);
    transition: transform 0.6s cubic-bezier(.22,1,.36,1);
  }
  #kitkat-modal.show #kitkat-card {
    transform: translateY(0) scale(1);
  }

  /* shimmer stripe */
  #kitkat-card::before {
    content: '';
    position: absolute; top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.04), transparent);
    animation: cardShimmer 3s linear infinite;
    pointer-events: none;
  }
  @keyframes cardShimmer {
    0%   { left: -60%; }
    100% { left: 120%; }
  }

  #kitkat-title {
    font-size: clamp(0.8rem, 1.6vw, 1rem);
    color: rgba(220,190,255,0.7);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: clamp(10px,2vw,18px);
  }

  /* KitKat SVG illustration wrapper */
  #kitkat-illus {
    width: min(80%, 240px);
    margin: 0 auto clamp(14px,2.5vw,22px);
    cursor: pointer;
    position: relative;
    filter: drop-shadow(0 6px 20px rgba(200,30,10,0.55));
    transition: transform 0.35s cubic-bezier(.22,1,.36,1), filter 0.35s ease;
  }
  #kitkat-illus:hover {
    transform: scale(1.06) rotate(-1.5deg);
    filter: drop-shadow(0 10px 30px rgba(220,50,20,0.75));
  }
  #kitkat-illus:active { transform: scale(0.97); }

  #kitkat-hint {
    font-size: clamp(0.6rem, 1.1vw, 0.72rem);
    color: rgba(180,140,255,0.55);
    letter-spacing: 0.06em;
    margin-top: -4px;
    margin-bottom: clamp(10px,2vw,16px);
    font-style: italic;
  }

  #kitkat-text {
    font-size: clamp(0.72rem, 1.4vw, 0.9rem);
    color: rgba(230,200,255,0.85);
    line-height: 1.6;
    margin-bottom: clamp(12px,2vw,18px);
  }

  /* Wrapper-open reveal */
  #wrapper-reveal {
    max-height: 0; overflow: hidden;
    transition: max-height 0.6s ease, opacity 0.5s ease;
    opacity: 0;
  }
  #wrapper-reveal.open { max-height: 200px; opacity: 1; }
  #gift-msg {
    font-size: clamp(0.85rem, 1.8vw, 1.05rem);
    color: #f0d0ff;
    margin-bottom: clamp(10px,1.8vw,16px);
  }

  /* Continue Button */
  #continue-btn {
    display: inline-block;
    padding: clamp(10px,1.5vh,16px) clamp(28px,5vw,52px);
    background: linear-gradient(135deg, #9b30ff, #c060ff);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: clamp(0.85rem, 1.8vw, 1.05rem);
    font-family: 'Georgia', serif;
    letter-spacing: 0.1em;
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.2s ease;
    box-shadow: 0 0 22px rgba(160,80,255,0.6), 0 4px 20px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  #continue-btn.show {
    opacity: 1; transform: translateY(0);
    pointer-events: auto;
    animation: continuePulse 2s ease-in-out infinite alternate;
  }
  #continue-btn:hover {
    box-shadow: 0 0 40px rgba(200,120,255,0.95), 0 4px 30px rgba(0,0,0,0.5);
    transform: scale(1.05);
    animation: none;
  }
  #continue-btn:active { transform: scale(0.95); }
  @keyframes continuePulse {
    0%   { box-shadow: 0 0 16px rgba(160,80,255,0.5); }
    100% { box-shadow: 0 0 44px rgba(200,120,255,0.95), 0 0 70px rgba(160,80,255,0.4); }
  }

  /* Fade overlay */
  #fade-overlay {
    position: fixed; inset: 0;
    background: #000; opacity: 0; pointer-events: none;
    z-index: 100; transition: opacity 1.2s ease;
  }
  #fade-overlay.active { opacity: 1; pointer-events: auto; }

  /* Floating hearts */
  .float-heart {
    position: fixed;
    font-size: clamp(12px,2.5vw,22px);
    opacity: 0; pointer-events: none; z-index: 52;
    animation: heartFloat 3s ease-out forwards;
    animation-delay: var(--hd, 0s);
  }
  @keyframes heartFloat {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(0.4); }
  }
</style>
</head>
<body>

<div id="scene">
  <div id="bg"></div>
  <div id="stars"></div>
  <div id="particles"></div>
  <div id="fairy-lights"><div class="wire"></div></div>
  <div id="balloons"></div>

  <!-- Header -->
  <div id="header">
    <h1 id="heading">🎂 Make a Wish...</h1>
    <p id="subtitle">Every birthday deserves a little magic. 💜</p>
    <p id="candle-hint">🕯️ Touch the flame to blow out the candle!</p>
  </div>

  <!-- Cake -->
  <div id="cake-section">
    <div id="cake-wrap">
      <svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg" width="100%" height="auto">
        <ellipse cx="150" cy="185" rx="110" ry="22" fill="#c8a0d8" opacity="0.5"/>
        <rect x="48" y="145" width="204" height="45" rx="10" fill="url(#frosting1)"/>
        <ellipse cx="150" cy="145" rx="102" ry="18" fill="url(#top1)"/>
        <path d="M70,145 Q75,162 72,170 Q77,148 90,145 Q95,166 92,172 Q98,148 112,145 Q118,168 115,174" stroke="#f8f0ff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
        <path d="M180,145 Q185,162 182,170 Q188,148 200,145 Q205,168 202,174 Q207,148 218,145 Q222,165 220,172" stroke="#f8f0ff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
        <ellipse cx="150" cy="138" rx="80" ry="15" fill="#d8b0e8" opacity="0.4"/>
        <rect x="74" y="102" width="152" height="42" rx="9" fill="url(#frosting2)"/>
        <ellipse cx="150" cy="102" rx="76" ry="14" fill="url(#top2)"/>
        <path d="M90,102 Q96,118 93,124 Q100,105 115,102 Q120,120 117,126" stroke="#f8f0ff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9"/>
        <path d="M170,102 Q175,118 173,126 Q180,105 195,102 Q200,120 197,126" stroke="#f8f0ff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9"/>
        <ellipse cx="150" cy="96" rx="52" ry="10" fill="#e8c0f8" opacity="0.4"/>
        <rect x="102" y="66" width="96" height="35" rx="8" fill="url(#frosting3)"/>
        <ellipse cx="150" cy="66" rx="48" ry="9" fill="url(#top3)"/>
        <rect x="48" y="162" width="204" height="6" rx="3" fill="#9b30ff" opacity="0.6"/>
        <rect x="74" y="120" width="152" height="5" rx="2.5" fill="#9b30ff" opacity="0.6"/>
        <rect x="102" y="82" width="96" height="4" rx="2" fill="#9b30ff" opacity="0.55"/>
        <circle cx="90" cy="155" r="4" fill="#f5c842" opacity="0.9"/>
        <circle cx="130" cy="158" r="3" fill="#f5c842" opacity="0.9"/>
        <circle cx="170" cy="155" r="4" fill="#f5c842" opacity="0.9"/>
        <circle cx="210" cy="158" r="3" fill="#f5c842" opacity="0.9"/>
        <text x="100" y="115" font-size="10" fill="#f5c842" opacity="0.9">★</text>
        <text x="145" y="118" font-size="8"  fill="#f5c842" opacity="0.9">✦</text>
        <text x="190" y="115" font-size="10" fill="#f5c842" opacity="0.9">★</text>
        <text x="126" y="80" font-size="8" fill="#f5c842" opacity="0.9">✦</text>
        <text x="164" y="78" font-size="8" fill="#f5c842" opacity="0.9">✦</text>
        <text x="150" y="136" text-anchor="middle" font-size="8.5" fill="#7a2eb5" font-family="Georgia,serif" letter-spacing="1" opacity="0.95">Happy Birthday</text>
        <text x="150" y="110" text-anchor="middle" font-size="7"   fill="#7a2eb5" font-family="Georgia,serif" letter-spacing="0.8" opacity="0.9">with love 💜</text>
        <defs>
          <linearGradient id="frosting1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fdf8ff"/><stop offset="100%" stop-color="#e8d5f5"/>
          </linearGradient>
          <radialGradient id="top1" cx="50%" cy="40%">
            <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#e0c8f0"/>
          </radialGradient>
          <linearGradient id="frosting2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fdf8ff"/><stop offset="100%" stop-color="#e8d5f5"/>
          </linearGradient>
          <radialGradient id="top2" cx="50%" cy="40%">
            <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#e8d5f5"/>
          </radialGradient>
          <linearGradient id="frosting3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#f0e0ff"/>
          </linearGradient>
          <radialGradient id="top3" cx="50%" cy="40%">
            <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#f0e0ff"/>
          </radialGradient>
        </defs>
      </svg>

      <!-- Candle -->
      <div id="candle-group" style="position:absolute;top:25%;left:50%;transform:translate(-50%,-100%);">
        <div id="flame-wrap" title="Click to blow out!">
          <div id="flame">
            <div class="flame-glow"></div>
            <div class="flame-inner flame-outer"></div>
            <div class="flame-inner flame-mid"></div>
          </div>
        </div>
        <div id="candle-body"></div>
        <div id="smoke">
          <div class="smoke-puff" style="--sd2:0s;--dx:-4px;"></div>
          <div class="smoke-puff" style="--sd2:0.2s;--dx:6px;"></div>
          <div class="smoke-puff" style="--sd2:0.4s;--dx:-3px;"></div>
        </div>
      </div>
    </div>
    <div id="cake-stand"></div>
  </div>

  <!-- Wish Message -->
  <div id="wish-msg"><h2>✨ Wish Granted! ✨</h2></div>

  <div id="confetti-container"></div>
  <div id="sparkle-container"></div>
</div>

<!-- ═══════ KitKat CENTERED MODAL ═══════ -->
<div id="kitkat-modal">
  <div id="kitkat-card">
    <p id="kitkat-title">🍫 A Little Surprise For You</p>

    <!-- Realistic KitKat SVG Illustration -->
    <div id="kitkat-illus" title="Click to unwrap!">
      <svg viewBox="0 0 280 140" xmlns="http://www.w3.org/2000/svg" width="100%" height="auto">
        <defs>
          <linearGradient id="wrapGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#e8281a"/>
            <stop offset="45%"  stop-color="#c41a0d"/>
            <stop offset="100%" stop-color="#8b0e05"/>
          </linearGradient>
          <linearGradient id="wrapSide" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#a01008"/>
            <stop offset="100%" stop-color="#c41a0d"/>
          </linearGradient>
          <linearGradient id="chocoGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#5c2e00"/>
            <stop offset="50%"  stop-color="#3d1f00"/>
            <stop offset="100%" stop-color="#2a1500"/>
          </linearGradient>
          <linearGradient id="fingerGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#6b3500"/>
            <stop offset="100%" stop-color="#3d1f00"/>
          </linearGradient>
          <linearGradient id="whiteStripe" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#e8e8e8" stop-opacity="0.9"/>
          </linearGradient>
          <filter id="softShadow">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
          </filter>
          <filter id="innerGlow">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur"/>
          </filter>
          <clipPath id="wrapClip">
            <rect x="10" y="18" width="260" height="104" rx="10"/>
          </clipPath>
        </defs>

        <!-- Shadow -->
        <ellipse cx="140" cy="132" rx="108" ry="8" fill="#000" opacity="0.35"/>

        <!-- Main wrapper body -->
        <rect x="10" y="18" width="260" height="104" rx="10" fill="url(#wrapGrad)" filter="url(#softShadow)"/>

        <!-- White band across top with KITKAT logo -->
        <rect x="10" y="28" width="260" height="38" fill="url(#whiteStripe)" clip-path="url(#wrapClip)"/>

        <!-- Red top strip back -->
        <rect x="10" y="18" width="260" height="12" fill="#d42015" rx="10" clip-path="url(#wrapClip)"/>

        <!-- KITKAT logo -->
        <text x="140" y="54" text-anchor="middle"
              font-size="22" font-family="Arial Black, Arial, sans-serif"
              font-weight="900" fill="#c0150a" letter-spacing="5"
              filter="url(#innerGlow)">KitKat</text>

        <!-- Registered trademark -->
        <text x="232" y="38" font-size="9" fill="#c0150a" font-family="Arial, sans-serif">®</text>

        <!-- Separator line below logo band -->
        <line x1="10" y1="66" x2="270" y2="66" stroke="#c0150a" stroke-width="1.5" opacity="0.6"/>

        <!-- Four chocolate fingers (bottom half of wrapper shows through) -->
        <!-- Finger dividers — subtle lines -->
        <line x1="75"  y1="68" x2="75"  y2="118" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
        <line x1="140" y1="68" x2="140" y2="118" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
        <line x1="205" y1="68" x2="205" y2="118" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

        <!-- Finger texture highlights -->
        <rect x="14"  y="70" width="57" height="44" rx="3" fill="rgba(255,255,255,0.04)"/>
        <rect x="79"  y="70" width="57" height="44" rx="3" fill="rgba(255,255,255,0.04)"/>
        <rect x="144" y="70" width="57" height="44" rx="3" fill="rgba(255,255,255,0.04)"/>
        <rect x="209" y="70" width="57" height="44" rx="3" fill="rgba(255,255,255,0.04)"/>

        <!-- Wafer line hints on each finger -->
        <line x1="14"  y1="84" x2="70"  y2="84" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="14"  y1="98" x2="70"  y2="98" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="79"  y1="84" x2="135" y2="84" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="79"  y1="98" x2="135" y2="98" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="144" y1="84" x2="200" y2="84" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="144" y1="98" x2="200" y2="98" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="209" y1="84" x2="265" y2="84" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="209" y1="98" x2="265" y2="98" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

        <!-- Wrapper fold edges (3D feel) -->
        <rect x="10"  y="18" width="8"  height="104" rx="4" fill="url(#wrapSide)" opacity="0.7"/>
        <rect x="262" y="18" width="8"  height="104" rx="4" fill="url(#wrapSide)" opacity="0.4"/>

        <!-- Foil glint / shine streak -->
        <rect x="22" y="20" width="4" height="100" rx="2" fill="rgba(255,255,255,0.12)"/>
        <rect x="30" y="20" width="2" height="100" rx="1" fill="rgba(255,255,255,0.06)"/>

        <!-- Bottom crease -->
        <line x1="10" y1="114" x2="270" y2="114" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>

        <!-- Wrapper border outline -->
        <rect x="10" y="18" width="260" height="104" rx="10"
              fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      </svg>
    </div>

    <p id="kitkat-hint">tap to unwrap 👆</p>
    <p id="kitkat-text">A little KitKat break before your next surprise. 🍫💜</p>

    <!-- Revealed after tap -->
    <div id="wrapper-reveal">
      <p id="gift-msg">Ready for your gift? 🎁</p>
      <button id="continue-btn">Continue →</button>
    </div>
  </div>
</div>

<div id="fade-overlay"></div>

<script>
(function(){
  'use strict';

  /* Fairy Lights */
  const lightsContainer = document.getElementById('fairy-lights');
  const colors = ['#ff6b9d','#ffd700','#9b59f5','#4fc3f7','#ff9500','#a8e063'];
  const count = Math.round(window.innerWidth / 55);
  for(let i=0;i<count;i++){
    const b = document.createElement('div');
    b.className = 'bulb';
    const col = colors[i%colors.length];
    b.style.cssText = `--col:${col};background:${col};--dur:${(2+Math.random()*3).toFixed(1)}s;animation-delay:${(Math.random()*2).toFixed(2)}s`;
    lightsContainer.appendChild(b);
  }

  /* Stars */
  const starsEl = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*80}%;--sd:${(2+Math.random()*5).toFixed(1)}s;animation-delay:${(Math.random()*4).toFixed(2)}s;opacity:${(0.2+Math.random()*0.7).toFixed(2)}`;
    starsEl.appendChild(s);
  }

  /* Particles */
  const particleEl = document.getElementById('particles');
  const pColors = ['rgba(180,120,255,0.5)','rgba(245,200,70,0.4)','rgba(255,180,220,0.4)','rgba(120,200,255,0.35)'];
  for(let i=0;i<28;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const sz = (3+Math.random()*5).toFixed(1)+'px';
    p.style.cssText = `--pc:${pColors[Math.floor(Math.random()*pColors.length)]};--ps:${sz};width:${sz};height:${sz};--pd:${(6+Math.random()*10).toFixed(1)}s;left:${Math.random()*100}%;animation-delay:${(Math.random()*10).toFixed(1)}s`;
    particleEl.appendChild(p);
  }

  /* Balloons */
  const balloonEl = document.getElementById('balloons');
  const balloonData = [
    {col:'#9b30ff',l:'4vw',t:'8vh',sw:'3.8s'},
    {col:'#f5c842',l:'10vw',t:'16vh',sw:'4.5s'},
    {col:'#ff6b9d',l:'82vw',t:'8vh',sw:'3.2s'},
    {col:'#4fc3f7',l:'88vw',t:'18vh',sw:'5s'},
  ];
  balloonData.forEach(bd=>{
    const b = document.createElement('div');
    b.className = 'balloon';
    b.style.cssText = `background:${bd.col};left:${bd.l};top:${bd.t};--bsw:${bd.sw};box-shadow:0 0 20px ${bd.col}88,0 0 40px ${bd.col}44;`;
    balloonEl.appendChild(b);
  });

  /* State */
  let wished = false;
  let kitkatClicked = false;

  /* Candle click */
  document.getElementById('flame-wrap').addEventListener('click', function(){
    if(wished) return;
    wished = true;
    blowOutCandle();
  });

  function blowOutCandle(){
    document.getElementById('flame').classList.add('out');
    document.getElementById('candle-hint').style.transition = 'opacity 0.6s';
    document.getElementById('candle-hint').style.opacity = '0';

    const smoke = document.getElementById('smoke');
    setTimeout(()=>{ smoke.classList.add('show'); },500);
    setTimeout(()=>{ smoke.classList.remove('show'); },2200);

    const bg = document.getElementById('bg');
    setTimeout(()=>{ bg.classList.add('dim'); },600);
    setTimeout(()=>{ bg.classList.remove('dim'); },1600);

    setTimeout(()=>{ document.getElementById('fairy-lights').classList.add('bright'); },1400);

    const cakeSec = document.getElementById('cake-section');
    setTimeout(()=>{
      cakeSec.style.animation='none';
      cakeSec.classList.add('bounce');
      cakeSec.addEventListener('animationend',()=>{
        cakeSec.classList.remove('bounce');
        cakeSec.style.animation='';
      },{once:true});
    },1600);

    setTimeout(()=>{ launchConfetti(); },1800);
    setTimeout(()=>{ launchSparkles(); },2000);

    setTimeout(()=>{
      document.querySelectorAll('.balloon').forEach(b=>{
        b.style.animationDelay = (Math.random()*0.5)+'s';
        b.classList.add('float-up');
      });
    },2200);

    setTimeout(()=>{ document.getElementById('wish-msg').classList.add('show'); },2600);
    setTimeout(()=>{ launchHearts(); },2800);

    /* KitKat modal — centered, fades in */
    setTimeout(()=>{
      document.getElementById('kitkat-modal').classList.add('show');
    },3800);
  }

  /* Confetti */
  function launchConfetti(){
    const container = document.getElementById('confetti-container');
    const confettiColors = ['#f5c842','#9b30ff','#ff6b9d','#4fc3f7','#a8e063','#ff9500','#fff'];
    for(let i=0;i<90;i++){
      const c = document.createElement('div');
      c.className = 'confetto';
      const fromLeft = i<45;
      c.style.cssText = `
        left:${fromLeft?(-5+Math.random()*25)+'%':(75+Math.random()*30)+'%'};
        top:${(-10-Math.random()*30)+'%'};
        --cf-col:${confettiColors[Math.floor(Math.random()*confettiColors.length)]};
        --cf-dur:${(1.8+Math.random()*1.8).toFixed(1)}s;
        --cf-del:${(Math.random()*0.8).toFixed(2)}s;
        --cf-rot:${(360+Math.random()*720).toFixed(0)}deg;
        --cf-r:${Math.random()>0.5?'50%':'2px'};
        width:${(6+Math.random()*8).toFixed(0)}px;
        height:${(6+Math.random()*8).toFixed(0)}px;
        transform:translateX(${fromLeft?'':'-'}${(Math.random()*200).toFixed(0)}px) translateY(${(Math.random()*80).toFixed(0)}px);
      `;
      container.appendChild(c);
      setTimeout(()=>{ if(c.parentNode) c.parentNode.removeChild(c); },3500);
    }
  }

  /* Sparkles */
  function launchSparkles(){
    const container = document.getElementById('sparkle-container');
    const sparkleColors = ['#f5c842','#e08cff','#fff','#ffcc00','#cc80ff'];
    for(let i=0;i<40;i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.cssText = `
        left:${35+Math.random()*30}%;top:${30+Math.random()*40}%;
        --sp-col:${sparkleColors[Math.floor(Math.random()*sparkleColors.length)]};
        --sp-dur:${(0.8+Math.random()*1.2).toFixed(1)}s;
        --sp-del:${(Math.random()*1).toFixed(2)}s;
        --sp-dx:${(Math.random()*120-60).toFixed(0)}px;
        --sp-dy:${(-40-Math.random()*80).toFixed(0)}px;
        width:${(5+Math.random()*10).toFixed(0)}px;
        height:${(5+Math.random()*10).toFixed(0)}px;
      `;
      container.appendChild(s);
      setTimeout(()=>{ if(s.parentNode) s.parentNode.removeChild(s); },2500);
    }
  }

  /* Floating Hearts */
  function launchHearts(){
    const emojis = ['💜','✨','⭐','💫','🌟'];
    for(let i=0;i<12;i++){
      const h = document.createElement('div');
      h.className = 'float-heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.cssText = `left:${10+Math.random()*80}%;bottom:${10+Math.random()*40}%;--hd:${(Math.random()*1.5).toFixed(2)}s`;
      document.body.appendChild(h);
      setTimeout(()=>{ if(h.parentNode) h.parentNode.removeChild(h); },4000);
    }
  }

  /* KitKat click — unwrap */
  document.getElementById('kitkat-illus').addEventListener('click', function(){
    if(kitkatClicked) return;
    kitkatClicked = true;
    document.getElementById('kitkat-hint').style.display = 'none';
    document.getElementById('kitkat-text').style.display = 'none';
    document.getElementById('wrapper-reveal').classList.add('open');
    setTimeout(()=>{
      document.getElementById('continue-btn').classList.add('show');
    },500);
  });

  /* Continue */
  document.getElementById('continue-btn').addEventListener('click', function(){
    document.getElementById('fade-overlay').classList.add('active');
    setTimeout(()=>{ window.location.href='gift.html'; },1300);
  });

  /* Prevent scroll */
  document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
  document.addEventListener('wheel',     e=>e.preventDefault(), {passive:false});
})();
</script>
</body>
</html>
