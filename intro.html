<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Surprise</title>

  <style>
    html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0015 0%, #1a0033 25%, #2d0052 50%, #4b0082 75%, #6a0dad 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    /* ===== Container ===== */
    .container {
      z-index: 10;
      width: min(90%, 800px);
      padding: 40px 20px;
      margin: auto;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      border: 1px solid rgba(255, 105, 180, 0.2);
      box-shadow: 0 8px 32px rgba(255, 105, 180, 0.15);
    }

    /* ===== Typing Lines ===== */
    .typing-line {
      font-weight: 500;
      overflow: hidden;
      border-right: 3px solid transparent;
      width: 0;
      margin: 20px auto;
      display: block;
      min-height: 40px;

      font-size: clamp(16px, 4vw, 28px);
      white-space: nowrap;
      letter-spacing: 1px;
    }

    #line3 {
      font-size: clamp(20px, 5vw, 32px);
      font-weight: 700;
      color: #ff69b4;
    }

    #line4 {
      font-size: clamp(18px, 4.5vw, 30px);
      font-weight: 600;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    /* ===== Button ===== */
    .btn {
      margin-top: 40px;
      background: linear-gradient(135deg, #ff1493, #ff69b4, #ffb3d9);
      color: #fff;
      padding: 16px 40px;
      font-size: clamp(14px, 3vw, 20px);
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
      transition: 0.4s ease;
      opacity: 0;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      transform: scale(1.08);
    }

    /* ===== Animations ===== */
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes sparkle {
      0%,100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }

    @keyframes float {
      0%,100% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
    }

    /* ===== Effects ===== */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,105,180,0.8), transparent);
      animation: float 6s infinite ease-in-out;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #fff;
      animation: sparkle 2s infinite;
    }

    .butterfly {
      position: absolute;
      font-size: 40px;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255,105,180,0.5));
      animation: flutter 2s infinite ease-in-out;
    }

    .butterfly-container {
      position: absolute;
      animation: flyButterfly 20s infinite ease-in-out;
    }

    @keyframes flutter {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

   @keyframes flyButterfly {
  0% {
    transform: translate(0, 0);
  }
  20% {
    transform: translate(calc(80px * var(--x1)), -60px);
  }
  40% {
    transform: translate(calc(-120px * var(--x2)), 90px);
  }
  60% {
    transform: translate(100px, calc(120px * var(--y1)));
  }
  80% {
    transform: translate(calc(-90px * var(--x2)), -110px);
  }
  100% {
    transform: translate(0, 0);
  }
}

  </style>
</head>

<body>

  <div class="container">
    <div id="line1" class="typing-line">Heyy Yooo</div>
    <div id="line2" class="typing-line">It's not just a normal day...</div>
    <div id="line3" class="typing-line">Hepppyy Borthdayy Baunii 😁</div>
    <div id="line4" class="typing-line"></div>

    <button class="btn" id="btn" onclick="location.href='home.html'">
      Aage Janna Hai?? 💥
    </button>
  </div>

  <script>
    const isMobile = window.innerWidth < 768;

    function createParticle() {
      const p = document.createElement("div");
      p.className = "particle";
      const size = Math.random() * 60 + 20;
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.left = Math.random() * 90 + "%";
      p.style.top = Math.random() * 90 + "%";
      document.body.appendChild(p);
    }

    function createSparkle() {
      const s = document.createElement("div");
      s.className = "sparkle";
      s.style.left = Math.random() * 90 + "%";
      s.style.top = Math.random() * 90 + "%";
      document.body.appendChild(s);
    }

    function createButterfly() {
  const c = document.createElement("div");
  c.className = "butterfly-container";

  c.style.left = Math.random() * 80 + 10 + "%";
  c.style.top = Math.random() * 80 + 10 + "%";

  // ⭐ ADD THIS (IMPORTANT)
  c.style.setProperty("--x1", Math.random() > 0.5 ? 1 : -1);
  c.style.setProperty("--x2", Math.random() > 0.5 ? 1 : -1);
  c.style.setProperty("--y1", Math.random() > 0.5 ? 1 : -1);

  const b = document.createElement("div");
  b.className = "butterfly";
  b.textContent = "🦋";

  c.appendChild(b);
  document.body.appendChild(c);
}


    const particleCount = isMobile ? 6 : 15;
const sparkleCount = isMobile ? 58 : 80;
const butterflyCount = isMobile ? 10 : 15;


    for (let i = 0; i < particleCount; i++) createParticle();
    for (let i = 0; i < sparkleCount; i++) createSparkle();
    for (let i = 0; i < butterflyCount; i++) createButterfly();

    function typeLine(id, delay) {
      setTimeout(() => {
        const el = document.getElementById(id);
        el.style.animation = "typing 2.5s steps(40,end) forwards";
        setTimeout(() => el.style.borderRight = "none", 2500);
      }, delay);
    }

    function showButton(delay) {
      setTimeout(() => {
        document.getElementById("btn").style.opacity = 1;
      }, delay);
    }

    typeLine("line1", 0);
    typeLine("line2", 3000);
    typeLine("line3", 6000);
    typeLine("line4", 9000);
    showButton(12000);
  </script>

</body>
</html>
