<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>💜 Memory Wall</title>
  <link rel="stylesheet" href="css/memory.css"/>
</head>
<body>

  <!-- Golden entry glow (matches gift transition) -->
  <div id="entry-glow"></div>

  <!-- Atmospheric layers -->
  <div id="mem-bg"></div>
  <div id="mem-stars"></div>
  <div id="mem-lights"><div class="mem-wire"></div></div>
  <div id="mem-particles"></div>
  <div id="mem-butterflies"></div>

  <!-- Scrapbook canvas -->
  <div id="scrapbook">

    <!-- Decorative elements (background of scrapbook) -->
    <div class="sb-deco sb-deco--flowers">🌸🌷✿🌼</div>
    <div class="sb-deco sb-deco--hearts">💜💜💜</div>
    <div class="sb-deco sb-deco--stars-top">⭐✨⭐</div>

    <!-- Memory slots — positioned on the scrapbook -->
    <div class="memory-slot" id="slot-1"
         data-src="images/photos/baby-birthday-poster.png"
         data-caption="Once upon a time... a little princess was born. 👶🎂"
         data-tape="top-left"
         data-clip="right">
    </div>

    <div class="memory-slot" id="slot-2"
         data-src="img/childhood-together.png"
         data-caption="Partners in crime since day one. ❤️"
         data-tape="top-right"
         data-clip="left">
    </div>

    <div class="memory-slot" id="slot-3"
         data-src="img"
         data-caption="Elegance never goes out of style. 🖤"
         data-tape="bottom-left"
         data-clip="top">
    </div>

    <div class="memory-slot" id="slot-4"
         data-src="img/cat-filter-selfie.png"
         data-caption="Cuteness level: 999+ 😼💜"
         data-tape="bottom-right"
         data-clip="right">
    </div>

  </div>
<button id="next-btn">Next ➜</button>
  <!-- Final letter -->
  <div id="final-letter">
    <div id="letter-paper">
      <div id="letter-lines"></div>
      <p id="letter-text"></p>
      <div id="heart-beat">💜</div>
      <button id="continue-btn">🍫 Continue</button>
    </div>
  </div>

  <!-- Ripple for button -->
  <div id="btn-ripple"></div>

  <script src="js/memory.js"></script>
</body>
</html>
