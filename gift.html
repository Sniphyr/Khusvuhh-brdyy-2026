<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🎁 Your Surprise</title>
  <link rel="stylesheet" href="css/gift.css"/>
</head>
<body>

  <!-- Background layers -->
  <div id="bg-overlay"></div>
  <div id="stars"></div>
  <div id="fairy-lights"><div class="wire"></div></div>
  <div id="particle-field"></div>

  <!-- Scene -->
  <div id="scene">

    <!-- Gift box -->
    <div id="gift-wrap">

      <!-- Glow halo -->
      <div id="gift-glow"></div>

      <!-- Box SVG -->
      <div id="gift-box">
        <svg id="box-svg" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="boxBody" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#7c3aed"/>
              <stop offset="100%" stop-color="#4c1d95"/>
            </linearGradient>
            <linearGradient id="boxLid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#8b5cf6"/>
              <stop offset="100%" stop-color="#6d28d9"/>
            </linearGradient>
            <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stop-color="#5b21b6"/>
              <stop offset="100%" stop-color="#4c1d95"/>
            </linearGradient>
            <linearGradient id="ribbonV" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stop-color="#fbbf24"/>
              <stop offset="50%"  stop-color="#fde68a"/>
              <stop offset="100%" stop-color="#fbbf24"/>
            </linearGradient>
            <linearGradient id="ribbonH" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#fbbf24"/>
              <stop offset="50%"  stop-color="#fde68a"/>
              <stop offset="100%" stop-color="#fbbf24"/>
            </linearGradient>
            <filter id="boxShadow">
              <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4c1d95" flood-opacity="0.6"/>
            </filter>
            <filter id="glowFilter">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur"/>
            </filter>
          </defs>

          <!-- Box body -->
          <rect x="20" y="110" width="180" height="120" rx="6" fill="url(#boxBody)" filter="url(#boxShadow)"/>
          <!-- Body side sheen -->
          <rect x="20" y="110" width="12" height="120" rx="3" fill="url(#boxSide)" opacity="0.5"/>
          <!-- Body highlight -->
          <rect x="32" y="114" width="3" height="112" rx="1.5" fill="rgba(255,255,255,0.12)"/>

          <!-- Lid -->
          <rect id="box-lid" x="10" y="88" width="200" height="30" rx="6" fill="url(#boxLid)"/>
          <!-- Lid highlight -->
          <rect x="22" y="92" width="3" height="22" rx="1.5" fill="rgba(255,255,255,0.18)"/>

          <!-- Vertical ribbon on body -->
          <rect x="100" y="110" width="20" height="120" fill="url(#ribbonV)" opacity="0.9"/>
          <!-- Vertical ribbon on lid -->
          <rect x="100" y="88" width="20" height="30" fill="url(#ribbonV)" opacity="0.9"/>

          <!-- Horizontal ribbon on body -->
          <rect x="20" y="155" width="180" height="18" fill="url(#ribbonH)" opacity="0.9"/>
          <!-- Horizontal ribbon on lid -->
          <rect x="10" y="96" width="200" height="14" fill="url(#ribbonH)" opacity="0.9"/>

          <!-- Bow left loop -->
          <ellipse id="bow-left" cx="88" cy="72" rx="26" ry="18" fill="#fbbf24" opacity="0.95"
                   transform="rotate(-25 88 72)"/>
          <ellipse cx="88" cy="72" rx="18" ry="11" fill="#fde68a" opacity="0.6"
                   transform="rotate(-25 88 72)"/>

          <!-- Bow right loop -->
          <ellipse id="bow-right" cx="132" cy="72" rx="26" ry="18" fill="#fbbf24" opacity="0.95"
                   transform="rotate(25 132 72)"/>
          <ellipse cx="132" cy="72" rx="18" ry="11" fill="#fde68a" opacity="0.6"
                   transform="rotate(25 132 72)"/>

          <!-- Bow center knot -->
          <ellipse cx="110" cy="82" rx="12" ry="9" fill="#f59e0b"/>
          <ellipse cx="110" cy="82" rx="7" ry="5.5" fill="#fde68a" opacity="0.7"/>

          <!-- Ribbon tails -->
          <path d="M104,90 Q96,110 88,130" stroke="#fbbf24" stroke-width="9" fill="none" stroke-linecap="round"/>
          <path d="M116,90 Q124,110 132,130" stroke="#fbbf24" stroke-width="9" fill="none" stroke-linecap="round"/>

          <!-- Box shine dots -->
          <circle cx="50"  cy="170" r="3" fill="rgba(255,255,255,0.15)"/>
          <circle cx="160" cy="200" r="2" fill="rgba(255,255,255,0.12)"/>
          <circle cx="170" cy="150" r="2.5" fill="rgba(255,255,255,0.1)"/>

          <!-- Golden light leak (hidden, shown on click 2) -->
          <ellipse id="light-leak" cx="110" cy="103" rx="0" ry="0"
                   fill="rgba(253,230,138,0.0)"/>
        </svg>

        <!-- Lid element for animation -->
        <div id="lid-anim"></div>
      </div>

      <!-- Butterflies container -->
      <div id="butterflies"></div>

      <!-- Golden explosion -->
      <div id="golden-burst"></div>
    </div>

    <!-- Text -->
    <div id="gift-text-wrap">
      <p id="gift-text">Ruko Jara sabar Karoo yarr</p>
    </div>

  </div>

  <!-- Full-screen flash/fade for transition -->
  <div id="transition-overlay"></div>

  <script src="js/gift.js"></script>
</body>
</html>
