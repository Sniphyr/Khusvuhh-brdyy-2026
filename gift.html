<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🎁 Your Surprise</title>
  <style>
/* ═══════════════════════════════════════════════════════════
   COMBINED: GIFT ROOM + MEMORY WALL — single file
   No page navigation. Pure cinematic scene swap.
═══════════════════════════════════════════════════════════ */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Georgia', 'Times New Roman', serif;
  background: #0d0818;
  color: #fff;
  touch-action: none;
  user-select: none;
}

/* ════════════════════════════════════════
   SCENE SYSTEM — two scenes, one visible
════════════════════════════════════════ */
.scene {
  position: fixed; inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0s;
  z-index: 0;
}
.scene.active {
  opacity: 1;
  pointer-events: auto;
}

/* Golden bridge overlay — covers scene swap */
#bridge {
  position: fixed; inset: 0;
  background: rgba(255,248,200,1);
  opacity: 0;
  pointer-events: none;
  z-index: 500;
  transition: opacity 1.4s ease;
}
#bridge.cover  { opacity: 1; pointer-events: auto; }
#bridge.uncover{ opacity: 0; pointer-events: none; }

/* ════════════════════════════════════════
   SCENE 1 — GIFT ROOM
════════════════════════════════════════ */

/* Background */
#gift-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 40%, #1e0a3c 0%, #0d0818 65%);
  transition: background 1.2s ease, filter 1s ease;
  z-index: 0;
}
#gift-bg.darker {
  background: radial-gradient(ellipse at 50% 40%, #0f0520 0%, #060210 70%);
  filter: brightness(0.7);
}
#gift-bg::after {
  content:''; position:absolute; inset:0;
  background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.8) 100%);
  pointer-events:none;
}

/* Stars */
#g-stars { position:absolute; inset:0; pointer-events:none; z-index:1; }
.star {
  position:absolute; width:2px; height:2px;
  background:#fff; border-radius:50%;
  animation: starTwinkle var(--sd,4s) ease-in-out infinite alternate;
}
@keyframes starTwinkle {
  0%  { opacity:0.15; transform:scale(0.7); }
  100%{ opacity:0.9;  transform:scale(1.4); }
}

/* Fairy lights */
#g-lights {
  position:absolute; top:0; left:0; right:0; height:7vh;
  display:flex; justify-content:space-around; align-items:flex-start;
  padding-top:0.5vh; z-index:3;
  transition: filter 0.8s ease;
}
#g-lights.bright { filter: brightness(1.8) saturate(1.4); }
.g-wire {
  position:absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(to right, transparent, rgba(255,210,80,0.25), transparent);
}
.bulb {
  width:clamp(6px,1.1vw,11px); height:clamp(9px,1.7vw,17px);
  border-radius:50% 50% 40% 40%;
  animation: bulbGlow var(--bd,3s) ease-in-out infinite alternate;
  box-shadow: 0 0 8px var(--bc), 0 0 18px var(--bc);
  position:relative;
}
.bulb::before {
  content:''; position:absolute; top:-4px; left:50%; transform:translateX(-50%);
  width:3px; height:5px; background:rgba(160,160,160,0.35); border-radius:2px 2px 0 0;
}
@keyframes bulbGlow { 0%{opacity:0.6} 100%{opacity:1} }

/* Particles */
#g-particles { position:absolute; inset:0; pointer-events:none; z-index:2; overflow:hidden; }
.spark {
  position:absolute; border-radius:50%;
  background:var(--sc,rgba(167,139,250,0.5));
  width:var(--ss,4px); height:var(--ss,4px);
  bottom:-10px; opacity:0;
  animation: sparkFloat var(--sf,9s) linear infinite var(--sfd,0s);
}
@keyframes sparkFloat {
  0%  { opacity:0; transform:translateY(0) scale(1) rotate(0); }
  8%  { opacity:0.8; }
  90% { opacity:0.3; }
  100%{ opacity:0; transform:translateY(-110vh) scale(0.3) rotate(360deg); }
}

/* Gift scene layout */
#gift-scene-inner {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:10; gap:clamp(16px,3.5vh,36px);
}

/* Gift wrap */
#gift-wrap {
  position:relative; display:flex;
  align-items:center; justify-content:center; cursor:pointer;
}

/* Glow halo */
#gift-glow {
  position:absolute;
  width:clamp(180px,35vw,380px); height:clamp(180px,35vw,380px);
  border-radius:50%;
  background:radial-gradient(circle, rgba(139,92,246,0.35) 0%, transparent 70%);
  animation: haloBreath 2.8s ease-in-out infinite alternate;
  pointer-events:none;
  transition: background 0.8s ease, transform 0.8s ease;
}
@keyframes haloBreath {
  0%  { transform:scale(0.92); opacity:0.6; }
  100%{ transform:scale(1.08); opacity:1; }
}
#gift-glow.bright {
  background:radial-gradient(circle, rgba(253,230,138,0.55) 0%, rgba(139,92,246,0.2) 55%, transparent 75%);
  transform:scale(1.3);
}

/* Gift box */
#gift-box {
  position:relative; width:clamp(140px,25vw,260px);
  animation: giftIdle 3.5s ease-in-out infinite;
}
#gift-box svg { width:100%; height:auto; }
@keyframes giftIdle {
  0%,100%{ transform:translateY(0) rotate(0deg); }
  25%    { transform:translateY(-8px) rotate(0.5deg); }
  75%    { transform:translateY(-4px) rotate(-0.5deg); }
}
#gift-box.shake { animation: giftShake 0.55s cubic-bezier(.36,.07,.19,.97); }
@keyframes giftShake {
  0%,100%{ transform:rotate(0); }
  15%{ transform:rotate(-4deg); }
  30%{ transform:rotate(4deg); }
  45%{ transform:rotate(-3deg); }
  60%{ transform:rotate(3deg); }
  75%{ transform:rotate(-1.5deg); }
  90%{ transform:rotate(1deg); }
}
#gift-box.zooming { animation: giftZoom 1.4s cubic-bezier(.22,1,.36,1) forwards; }
@keyframes giftZoom {
  0%  { transform:scale(1); }
  100%{ transform:scale(1.18); }
}

/* Butterflies */
#butterflies { position:fixed; inset:0; pointer-events:none; z-index:15; overflow:hidden; }
.butterfly {
  position:absolute; opacity:0;
  animation: butterflyFly var(--bf-dur,3s) ease-out var(--bf-del,0s) forwards;
}
@keyframes butterflyFly {
  0%  { opacity:0; transform:translate(0,0) scale(0.5) rotate(0); }
  10% { opacity:1; }
  80% { opacity:0.8; }
  100%{ opacity:0; transform:translate(var(--bf-tx,50px),var(--bf-ty,-150px)) scale(1.2) rotate(var(--bf-rot,20deg)); }
}

/* Golden burst */
#golden-burst {
  position:fixed; inset:0; pointer-events:none; z-index:20;
  background:radial-gradient(ellipse at center, rgba(253,230,138,0) 0%, transparent 60%);
  opacity:0;
}
#golden-burst.explode { animation: goldenExplode 2.2s ease-out forwards; }
@keyframes goldenExplode {
  0%  { opacity:0; background:radial-gradient(ellipse at center, rgba(253,230,138,0) 0%, transparent 40%); }
  15% { opacity:1; background:radial-gradient(ellipse at center, rgba(255,245,180,0.9) 0%, rgba(253,186,80,0.6) 35%, transparent 65%); }
  60% { opacity:1; background:radial-gradient(ellipse at center, rgba(255,251,220,1) 0%, rgba(253,200,100,0.8) 50%, transparent 80%); }
  100%{ opacity:1; background:radial-gradient(ellipse at center, rgba(255,253,240,1) 0%, rgba(255,245,180,1) 100%); }
}

/* Gift text */
#gift-text-wrap { position:relative; z-index:12; text-align:center; }
#gift-text {
  font-size:clamp(1rem,2.8vw,1.6rem);
  color:rgba(233,213,255,0.9);
  letter-spacing:0.06em; font-style:italic;
  text-shadow:0 0 20px rgba(167,139,250,0.5);
  transition: opacity 0.5s ease, transform 0.5s ease;
  animation: textGlow 3s ease-in-out infinite alternate;
}
@keyframes textGlow {
  0%  { text-shadow:0 0 12px rgba(167,139,250,0.4); }
  100%{ text-shadow:0 0 28px rgba(196,181,253,0.8),0 0 50px rgba(139,92,246,0.3); }
}
#gift-text.fade-out { opacity:0; transform:translateY(-8px); }

/* Escape particles */
.escape-particle {
  position:fixed; border-radius:50%;
  background:var(--epc,#a78bfa); pointer-events:none; z-index:18; opacity:0;
  animation: escapeOut var(--ep-dur,1s) ease-out var(--ep-del,0s) forwards;
}
@keyframes escapeOut {
  0%  { opacity:1; transform:translate(0,0) scale(1); }
  100%{ opacity:0; transform:translate(var(--ep-tx,60px),var(--ep-ty,-80px)) scale(0.2); }
}

/* Paper bits */
.paper-bit {
  position:fixed; border-radius:2px;
  background:var(--pb-col,rgba(233,213,255,0.7));
  pointer-events:none; z-index:19; opacity:0;
  animation: paperDrift var(--pb-dur,2s) ease-out var(--pb-del,0s) forwards;
}
@keyframes paperDrift {
  0%  { opacity:0.9; transform:translate(0,0) rotate(0) scale(1); }
  100%{ opacity:0; transform:translate(var(--pb-tx,40px),var(--pb-ty,-120px)) rotate(var(--pb-rot,180deg)) scale(0.4); }
}

/* ════════════════════════════════════════
   SCENE 2 — MEMORY WALL
════════════════════════════════════════ */

/* Background */
#mem-bg {
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(109,40,217,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(124,58,237,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(15,5,40,1) 0%, rgba(10,2,25,1) 100%);
  z-index:0;
}
#mem-bg::after {
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.6) 100%);
  pointer-events:none;
}

/* Mem stars */
#m-stars { position:absolute; inset:0; pointer-events:none; z-index:1; }
.mem-star {
  position:absolute; width:2px; height:2px;
  background:#fff; border-radius:50%;
  animation: memStarTwinkle var(--msd,4s) ease-in-out infinite alternate;
}
@keyframes memStarTwinkle {
  0%  { opacity:0.1; transform:scale(0.8); }
  100%{ opacity:0.9; transform:scale(1.5); }
}

/* Mem fairy lights */
#m-lights {
  position:absolute; top:0; left:0; right:0; height:6vh;
  display:flex; justify-content:space-around; align-items:flex-start;
  padding-top:0.4vh; z-index:3;
  opacity:0; transition:opacity 1.5s ease;
}
#m-lights.show { opacity:1; }
.m-wire {
  position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(to right, transparent, rgba(251,191,36,0.2), transparent);
}
.mem-bulb {
  width:clamp(5px,1vw,10px); height:clamp(8px,1.5vw,15px);
  border-radius:50% 50% 40% 40%;
  animation: memBulbGlow var(--mbd,3s) ease-in-out infinite alternate;
  box-shadow:0 0 7px var(--mbc),0 0 15px var(--mbc);
  position:relative;
}
.mem-bulb::before {
  content:''; position:absolute; top:-3px; left:50%; transform:translateX(-50%);
  width:3px; height:4px; background:rgba(150,150,150,0.3); border-radius:2px 2px 0 0;
}
@keyframes memBulbGlow { 0%{opacity:0.5} 100%{opacity:1} }

/* Mem particles */
#m-particles { position:absolute; inset:0; pointer-events:none; z-index:2; overflow:hidden; }
.mem-spark {
  position:absolute; border-radius:50%;
  background:var(--msc,rgba(167,139,250,0.5));
  width:var(--mss,4px); height:var(--mss,4px);
  bottom:-10px; opacity:0;
  animation: memSparkFloat var(--msf,10s) linear infinite var(--msfd,0s);
}
@keyframes memSparkFloat {
  0%  { opacity:0; transform:translateY(0) scale(1); }
  8%  { opacity:0.8; }
  90% { opacity:0.3; }
  100%{ opacity:0; transform:translateY(-110vh) scale(0.2); }
}

/* Ambient butterflies */
#m-butterflies { position:absolute; inset:0; pointer-events:none; z-index:4; overflow:hidden; }
.mem-butterfly {
  position:absolute; opacity:0.7;
  animation: memButterflyDrift var(--mbfd,6s) ease-in-out infinite alternate;
}
@keyframes memButterflyDrift {
  0%  { transform:translateX(0) translateY(0) rotate(-5deg); }
  100%{ transform:translateX(var(--mbdx,20px)) translateY(var(--mbdy,-15px)) rotate(5deg); }
}

/* Scrapbook grid */
#scrapbook {
  position:absolute; inset:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:clamp(12px,2.5vw,28px);
  padding:clamp(48px,9vh,88px) clamp(16px,4vw,48px) clamp(16px,4vh,40px);
  z-index:10; overflow:hidden;
}

/* Decorations */
.sb-deco {
  position:absolute; font-size:clamp(10px,1.6vw,18px);
  opacity:0; transition:opacity 2s ease;
  pointer-events:none; letter-spacing:4px;
}
.sb-deco--flowers { top:clamp(36px,7vh,70px); left:clamp(10px,2vw,24px); }
.sb-deco--hearts  { bottom:clamp(10px,2vh,20px); right:clamp(10px,2vw,24px); }
.sb-deco--stars-top { top:clamp(36px,7vh,70px); right:clamp(10px,2vw,24px); }
.sb-deco.show { opacity:0.55; }

/* Memory slot */
.memory-slot {
  position:relative; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  opacity:0;
}

/* Polaroid */
.polaroid {
  position:relative; background:#fffef8;
  padding:clamp(6px,1.2vw,14px) clamp(6px,1.2vw,14px) clamp(20px,4.5vh,40px);
  border-radius:2px;
  box-shadow:0 4px 16px rgba(0,0,0,0.35),0 1px 4px rgba(0,0,0,0.2),inset 0 0 0 1px rgba(0,0,0,0.06);
  max-width:100%; transform-origin:center bottom;
  transition:transform 0.4s ease, box-shadow 0.4s ease;
}
.polaroid:hover {
  transform:scale(1.03) rotate(var(--ph-rot,1deg));
  box-shadow:0 12px 40px rgba(109,40,217,0.3),0 4px 12px rgba(0,0,0,0.3);
}
.polaroid img {
  display:block; width:100%;
  height:clamp(80px,16vh,180px); object-fit:cover; object-position:center top;
  border-radius:1px; filter:saturate(0.9) contrast(1.05);
}
.polaroid-caption {
  text-align:center; font-size:clamp(0.5rem,1.1vw,0.72rem);
  color:#4a3060; font-style:italic; font-family:'Georgia',serif;
  margin-top:clamp(4px,1vh,10px); letter-spacing:0.02em; line-height:1.4; padding:0 2px;
}

/* Washi tape */
.washi { position:absolute; height:clamp(10px,1.8vh,20px); border-radius:2px; opacity:0.82; z-index:5; pointer-events:none; }
.washi--top-left {
  width:clamp(36px,7vw,70px); top:clamp(-6px,-1vh,-4px); left:clamp(10px,2vw,20px); transform:rotate(-8deg);
  background:repeating-linear-gradient(90deg,rgba(167,139,250,0.7) 0px,rgba(167,139,250,0.7) 8px,rgba(196,181,253,0.5) 8px,rgba(196,181,253,0.5) 16px);
}
.washi--top-right {
  width:clamp(36px,7vw,70px); top:clamp(-6px,-1vh,-4px); right:clamp(10px,2vw,20px); transform:rotate(7deg);
  background:repeating-linear-gradient(90deg,rgba(251,191,36,0.75) 0px,rgba(251,191,36,0.75) 8px,rgba(253,230,138,0.55) 8px,rgba(253,230,138,0.55) 16px);
}
.washi--bottom-left {
  width:clamp(36px,7vw,70px); bottom:clamp(16px,3.5vh,35px); left:clamp(-8px,-1.5vw,-4px); transform:rotate(12deg);
  background:repeating-linear-gradient(90deg,rgba(244,114,182,0.7) 0px,rgba(244,114,182,0.7) 8px,rgba(251,207,232,0.5) 8px,rgba(251,207,232,0.5) 16px);
}
.washi--bottom-right {
  width:clamp(36px,7vw,70px); bottom:clamp(16px,3.5vh,35px); right:clamp(-8px,-1.5vw,-4px); transform:rotate(-10deg);
  background:repeating-linear-gradient(90deg,rgba(52,211,153,0.65) 0px,rgba(52,211,153,0.65) 8px,rgba(167,243,208,0.45) 8px,rgba(167,243,208,0.45) 16px);
}

/* Paper clip */
.paper-clip { position:absolute; width:clamp(14px,2.5vw,24px); height:clamp(28px,5vh,50px); z-index:6; pointer-events:none; }
.paper-clip--right { right:clamp(-10px,-1.8vw,-6px); top:30%; }
.paper-clip--left  { left:clamp(-10px,-1.8vw,-6px); top:30%; }
.paper-clip--top   { top:clamp(-14px,-2.5vh,-8px); left:50%; transform:translateX(-50%) rotate(90deg); }
.clip-svg { width:100%; height:100%; }

/* Fly-in animation */
.memory-slot.flying .polaroid {
  animation: photoFlyIn var(--fly-dur,1.2s) cubic-bezier(.22,1,.36,1) var(--fly-del,0s) both;
}
@keyframes photoFlyIn {
  0%  { opacity:0; transform:translate(var(--fly-sx,0px),var(--fly-sy,80px)) rotate(var(--fly-sr,0deg)) scale(0.4); }
  65% { opacity:1; transform:translate(calc(var(--fly-sx,0px)*0.1),calc(var(--fly-sy,80px)*0.1)) rotate(calc(var(--fly-sr,0deg)*0.2)) scale(1.05); }
  80% { transform:translate(0,0) rotate(var(--fly-er,0deg)) scale(0.97); }
  90% { transform:translate(0,0) rotate(var(--fly-er,0deg)) scale(1.02); }
  100%{ opacity:1; transform:translate(0,0) rotate(var(--fly-er,0deg)) scale(1); }
}

/* Memory sparkles */
.mem-sparkle {
  position:fixed; pointer-events:none; z-index:20; opacity:0;
  animation: memSparkleAnim var(--msp-dur,1s) ease-out var(--msp-del,0s) forwards;
}
@keyframes memSparkleAnim {
  0%  { opacity:1; transform:translate(0,0) scale(1); }
  100%{ opacity:0; transform:translate(var(--msp-tx,20px),var(--msp-ty,-50px)) scale(0.3); }
}

/* Purple hearts */
.mem-heart {
  position:fixed; pointer-events:none; z-index:22;
  font-size:clamp(12px,2vw,20px); opacity:0;
  animation: heartPop var(--hp-dur,1.5s) ease-out var(--hp-del,0s) forwards;
}
@keyframes heartPop {
  0%  { opacity:1; transform:translate(0,0) scale(0.5); }
  40% { opacity:1; transform:translate(var(--hp-tx,0),calc(var(--hp-ty,0)*0.4)) scale(1.3); }
  100%{ opacity:0; transform:translate(var(--hp-tx,0),var(--hp-ty,-80px)) scale(0.6); }
}

/* ════════════════════════════════════════
   FINAL LETTER
════════════════════════════════════════ */
#final-letter {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  z-index:50; opacity:0; pointer-events:none;
  transition:opacity 0.8s ease;
  background:rgba(10,2,25,0.55);
  backdrop-filter:blur(6px);
}
#final-letter.show { opacity:1; pointer-events:auto; }

#letter-paper {
  position:relative;
  background:linear-gradient(160deg, #fffef5 0%, #fdf8ee 60%, #faf3e0 100%);
  border-radius:4px; width:min(88vw,440px);
  padding:clamp(24px,5vw,52px) clamp(22px,4.5vw,48px) clamp(20px,4vw,40px);
  box-shadow:0 20px 60px rgba(109,40,217,0.3),0 4px 20px rgba(0,0,0,0.35),inset 0 0 0 1px rgba(109,40,217,0.08);
  transform:translateY(30px) rotate(-1deg);
  animation:letterSlideIn 0.9s cubic-bezier(.22,1,.36,1) forwards;
  animation-play-state:paused; overflow:hidden;
}
#final-letter.show #letter-paper { animation-play-state:running; }
@keyframes letterSlideIn {
  0%  { transform:translateY(50px) rotate(-2deg); opacity:0; }
  100%{ transform:translateY(0) rotate(-0.5deg); opacity:1; }
}

#letter-lines {
  position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(
    to bottom, transparent,
    transparent calc(clamp(22px,4vh,32px) - 1px),
    rgba(180,140,255,0.12) calc(clamp(22px,4vh,32px) - 1px),
    rgba(180,140,255,0.12) clamp(22px,4vh,32px)
  );
  background-position:0 clamp(22px,4vh,32px);
}
#letter-paper::before {
  content:''; position:absolute; top:0; bottom:0;
  left:clamp(36px,7vw,54px); width:1px;
  background:rgba(220,160,200,0.25); pointer-events:none;
}
#letter-text {
  position:relative; font-family:'Georgia',serif;
  font-size:clamp(0.82rem,1.8vw,1.05rem); color:#3d2060;
  line-height:clamp(22px,4vh,32px); white-space:pre-line;
  letter-spacing:0.02em; min-height:clamp(80px,18vh,160px);
  padding-left:clamp(18px,3.5vw,28px);
}
#letter-text::after {
  content:'|'; color:#7c3aed;
  animation:letterCursor 0.7s step-end infinite;
}
@keyframes letterCursor { 0%,100%{opacity:1} 50%{opacity:0} }
#letter-text.done::after { display:none; }

#heart-beat {
  text-align:center; font-size:clamp(1.4rem,3vw,2.2rem);
  margin-top:clamp(10px,2vh,18px); opacity:0;
  transition:opacity 0.6s ease;
  animation:heartBeat 1.1s ease-in-out infinite; animation-play-state:paused;
}
#heart-beat.show { opacity:1; animation-play-state:running; }
@keyframes heartBeat {
  0%,100%{ transform:scale(1); }
  14%    { transform:scale(1.18); }
  28%    { transform:scale(1); }
  42%    { transform:scale(1.12); }
  70%    { transform:scale(1); }
}

/* Continue button */
#continue-btn {
  display:block; margin:clamp(12px,2.5vh,22px) auto 0;
  padding:clamp(10px,1.8vh,16px) clamp(28px,5vw,52px);
  background:linear-gradient(135deg, #7c3aed, #a855f7);
  color:#fff; border:none; border-radius:50px;
  font-family:'Georgia',serif; font-size:clamp(0.85rem,1.8vw,1.05rem);
  letter-spacing:0.1em; cursor:pointer; opacity:0;
  transform:translateY(10px);
  transition:opacity 0.7s ease, transform 0.7s ease, box-shadow 0.25s ease;
  box-shadow:0 4px 20px rgba(124,58,237,0.45);
  position:relative; overflow:hidden;
}
#continue-btn.show {
  opacity:1; transform:translateY(0);
  animation:btnPulse 2.2s ease-in-out infinite alternate;
}
#continue-btn:hover { transform:translateY(-3px) scale(1.04); box-shadow:0 10px 35px rgba(168,85,247,0.65); animation:none; }
#continue-btn:active { transform:scale(0.96); }
@keyframes btnPulse {
  0%  { box-shadow:0 4px 18px rgba(124,58,237,0.4); }
  100%{ box-shadow:0 8px 40px rgba(168,85,247,0.75),0 0 60px rgba(124,58,237,0.3); }
}

/* Ripple */
#btn-ripple {
  position:fixed; border-radius:50%;
  background:rgba(167,139,250,0.35); transform:scale(0);
  pointer-events:none; z-index:600;
}
#btn-ripple.rippling { animation:rippleOut 0.6s ease-out forwards; }
@keyframes rippleOut {
  0%  { transform:scale(0); opacity:0.8; }
  100%{ transform:scale(6); opacity:0; }
}
  </style>
</head>
<body>

<!-- ══════════ GOLDEN BRIDGE OVERLAY ══════════ -->
<div id="bridge"></div>

<!-- ══════════ SCENE 1: GIFT ROOM ══════════ -->
<div class="scene active" id="scene-gift">
  <div id="gift-bg"></div>
  <div id="g-stars"></div>
  <div id="g-lights"><div class="g-wire"></div></div>
  <div id="g-particles"></div>

  <div id="gift-scene-inner">
    <div id="gift-wrap">
      <div id="gift-glow"></div>
      <div id="gift-box">
        <svg id="box-svg" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="boxBody" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4c1d95"/>
            </linearGradient>
            <linearGradient id="boxLid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/>
            </linearGradient>
            <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#5b21b6"/><stop offset="100%" stop-color="#4c1d95"/>
            </linearGradient>
            <linearGradient id="ribbonV" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#fbbf24"/><stop offset="50%" stop-color="#fde68a"/><stop offset="100%" stop-color="#fbbf24"/>
            </linearGradient>
            <linearGradient id="ribbonH" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fbbf24"/><stop offset="50%" stop-color="#fde68a"/><stop offset="100%" stop-color="#fbbf24"/>
            </linearGradient>
            <filter id="boxShadow">
              <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4c1d95" flood-opacity="0.6"/>
            </filter>
          </defs>
          <rect x="20" y="110" width="180" height="120" rx="6" fill="url(#boxBody)" filter="url(#boxShadow)"/>
          <rect x="20" y="110" width="12" height="120" rx="3" fill="url(#boxSide)" opacity="0.5"/>
          <rect x="32" y="114" width="3" height="112" rx="1.5" fill="rgba(255,255,255,0.12)"/>
          <rect id="box-lid" x="10" y="88" width="200" height="30" rx="6" fill="url(#boxLid)"/>
          <rect x="22" y="92" width="3" height="22" rx="1.5" fill="rgba(255,255,255,0.18)"/>
          <rect x="100" y="110" width="20" height="120" fill="url(#ribbonV)" opacity="0.9"/>
          <rect x="100" y="88" width="20" height="30" fill="url(#ribbonV)" opacity="0.9"/>
          <rect x="20" y="155" width="180" height="18" fill="url(#ribbonH)" opacity="0.9"/>
          <rect x="10" y="96" width="200" height="14" fill="url(#ribbonH)" opacity="0.9"/>
          <ellipse id="bow-left" cx="88" cy="72" rx="26" ry="18" fill="#fbbf24" opacity="0.95" transform="rotate(-25 88 72)"/>
          <ellipse cx="88" cy="72" rx="18" ry="11" fill="#fde68a" opacity="0.6" transform="rotate(-25 88 72)"/>
          <ellipse id="bow-right" cx="132" cy="72" rx="26" ry="18" fill="#fbbf24" opacity="0.95" transform="rotate(25 132 72)"/>
          <ellipse cx="132" cy="72" rx="18" ry="11" fill="#fde68a" opacity="0.6" transform="rotate(25 132 72)"/>
          <ellipse cx="110" cy="82" rx="12" ry="9" fill="#f59e0b"/>
          <ellipse cx="110" cy="82" rx="7" ry="5.5" fill="#fde68a" opacity="0.7"/>
          <path d="M104,90 Q96,110 88,130" stroke="#fbbf24" stroke-width="9" fill="none" stroke-linecap="round"/>
          <path d="M116,90 Q124,110 132,130" stroke="#fbbf24" stroke-width="9" fill="none" stroke-linecap="round"/>
          <circle cx="50" cy="170" r="3" fill="rgba(255,255,255,0.15)"/>
          <circle cx="160" cy="200" r="2" fill="rgba(255,255,255,0.12)"/>
          <circle cx="170" cy="150" r="2.5" fill="rgba(255,255,255,0.1)"/>
        </svg>
      </div>
      <div id="butterflies"></div>
      <div id="golden-burst"></div>
    </div>
    <div id="gift-text-wrap">
      <p id="gift-text">Your Surprise Is Waiting... 🎁</p>
    </div>
  </div>
</div>

<!-- ══════════ SCENE 2: MEMORY WALL ══════════ -->
<div class="scene" id="scene-memory">
  <div id="mem-bg"></div>
  <div id="m-stars"></div>
  <div id="m-lights"><div class="m-wire"></div></div>
  <div id="m-particles"></div>
  <div id="m-butterflies"></div>

  <div id="scrapbook">
    <div class="sb-deco sb-deco--flowers">🌸🌷✿🌼</div>
    <div class="sb-deco sb-deco--hearts">💜💜💜</div>
    <div class="sb-deco sb-deco--stars-top">⭐✨⭐</div>

    <div class="memory-slot" id="slot-1"></div>
    <div class="memory-slot" id="slot-2"></div>
    <div class="memory-slot" id="slot-3"></div>
    <div class="memory-slot" id="slot-4"></div>
  </div>

  <div id="final-letter">
    <div id="letter-paper">
      <div id="letter-lines"></div>
      <p id="letter-text"></p>
      <div id="heart-beat">💜</div>
      <button id="continue-btn">🍫 Continue</button>
    </div>
  </div>
</div>

<!-- Ripple (global) -->
<div id="btn-ripple"></div>

<script>
(function(){
  'use strict';

  /* ════════════════════════════════════
     SHARED HELPERS
  ════════════════════════════════════ */
  function rand(min, max){ return min + Math.random() * (max - min); }
  function randInt(min, max){ return Math.floor(rand(min, max)); }

  /* ════════════════════════════════════
     BUILD GIFT ROOM ENVIRONMENT
  ════════════════════════════════════ */
  (function buildGiftEnv(){
    // Fairy lights
    const lc = ['#ff6b9d','#ffd700','#a78bfa','#67e8f9','#fb923c','#86efac'];
    const cnt = Math.max(10, Math.round(window.innerWidth / 52));
    const gl  = document.getElementById('g-lights');
    for(let i=0;i<cnt;i++){
      const b = document.createElement('div');
      b.className = 'bulb';
      const c = lc[i%lc.length];
      b.style.cssText = `--bc:${c};background:${c};--bd:${rand(2,5).toFixed(1)}s;animation-delay:${rand(0,2).toFixed(2)}s`;
      gl.appendChild(b);
    }
    // Stars
    const gs = document.getElementById('g-stars');
    for(let i=0;i<55;i++){
      const s = document.createElement('div');
      s.className = 'star';
      s.style.cssText = `left:${rand(0,100)}%;top:${rand(0,85)}%;--sd:${rand(2,7).toFixed(1)}s;animation-delay:${rand(0,5).toFixed(2)}s;opacity:${rand(0.2,0.8).toFixed(2)}`;
      gs.appendChild(s);
    }
    // Sparks
    const sc = ['rgba(167,139,250,0.6)','rgba(253,230,138,0.5)','rgba(233,213,255,0.5)','rgba(196,181,253,0.55)','rgba(251,191,36,0.4)'];
    const gp = document.getElementById('g-particles');
    for(let i=0;i<30;i++){
      const p = document.createElement('div');
      p.className = 'spark';
      const sz = rand(3,8).toFixed(1)+'px';
      p.style.cssText = `--sc:${sc[randInt(0,sc.length)]};--ss:${sz};width:${sz};height:${sz};left:${rand(0,100)}%;--sf:${rand(7,16).toFixed(1)}s;--sfd:${rand(0,10).toFixed(1)}s`;
      gp.appendChild(p);
    }
  })();

  /* ════════════════════════════════════
     GIFT ROOM — 3-click logic
  ════════════════════════════════════ */
  let clickCount   = 0;
  let transitioning = false;

  const giftWrap  = document.getElementById('gift-wrap');
  const giftBox   = document.getElementById('gift-box');
  const giftGlow  = document.getElementById('gift-glow');
  const giftText  = document.getElementById('gift-text');
  const giftBg    = document.getElementById('gift-bg');
  const gLights   = document.getElementById('g-lights');
  const burst     = document.getElementById('golden-burst');
  const bfCont    = document.getElementById('butterflies');
  const bridge    = document.getElementById('bridge');

  giftWrap.addEventListener('click', handleGiftClick);
  giftWrap.addEventListener('touchend', e=>{ e.preventDefault(); handleGiftClick(); });

  function handleGiftClick(){
    if(transitioning) return;
    clickCount++;
    if(clickCount===1) doClick1();
    else if(clickCount===2) doClick2();
    else if(clickCount===3) doClick3();
  }

  /* Click 1 — shake + escape particles */
  function doClick1(){
    giftBox.classList.remove('shake');
    void giftBox.offsetWidth;
    giftBox.classList.add('shake');
    giftBox.addEventListener('animationend',()=>giftBox.classList.remove('shake'),{once:true});

    giftGlow.style.transform = 'scale(1.15)';
    setTimeout(()=>{ giftGlow.style.transform=''; }, 500);

    spawnEscapeParticles(18);

    setTimeout(()=>{
      giftText.classList.add('fade-out');
      setTimeout(()=>{
        giftText.textContent = 'Hmm... Something magical is inside... ✨';
        giftText.classList.remove('fade-out');
      }, 500);
    }, 300);
  }

  /* Click 2 — ribbon unties, golden leak, zoom */
  function doClick2(){
    giftBg.classList.add('darker');
    gLights.classList.add('bright');

    const bl = document.getElementById('bow-left');
    const br = document.getElementById('bow-right');
    if(bl && br){
      bl.style.transition = br.style.transition = 'transform 1s ease, opacity 1s ease';
      setTimeout(()=>{
        bl.style.transform = 'rotate(-60deg) scale(0.5) translate(-30px,-20px)'; bl.style.opacity='0.3';
        br.style.transform = 'rotate(60deg) scale(0.5) translate(30px,-20px)';  br.style.opacity='0.3';
      },100);
    }

    giftGlow.classList.add('bright');
    giftBox.style.animation='none';
    giftBox.classList.add('zooming');
    spawnButterflies(6);

    setTimeout(()=>{
      giftText.classList.add('fade-out');
      setTimeout(()=>{
        giftText.textContent = 'The magic is about to be revealed... 💜';
        giftText.classList.remove('fade-out');
      },500);
    },400);
  }

  /* Click 3 — lid lifts, golden explosion → scene swap */
  function doClick3(){
    transitioning = true;

    const lid = document.getElementById('box-lid');
    if(lid){
      lid.style.transition = 'transform 1s cubic-bezier(.22,1,.36,1), opacity 0.8s ease';
      lid.style.transformOrigin = '110px 88px';
      lid.style.transform = 'rotate(-45deg) translateY(-60px)';
      lid.style.opacity = '0';
    }

    spawnPaperBits(20);
    spawnButterflies(12);
    setTimeout(()=>{ burst.classList.add('explode'); }, 400);

    // Cover with golden bridge
    setTimeout(()=>{
      bridge.classList.add('cover');
    }, 1600);

    // Swap scenes under cover
    setTimeout(()=>{
      document.getElementById('scene-gift').classList.remove('active');
      document.getElementById('scene-memory').classList.add('active');
      initMemoryWall();
    }, 2200);

    // Uncover — reveals memory wall
    setTimeout(()=>{
      bridge.classList.remove('cover');
      bridge.classList.add('uncover');
    }, 2600);

    giftText.classList.add('fade-out');
  }

  /* Gift helpers */
  function spawnEscapeParticles(n){
    const cols = ['#a78bfa','#c4b5fd','#fbbf24','#e9d5ff','#8b5cf6'];
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    for(let i=0;i<n;i++){
      const p = document.createElement('div');
      p.className = 'escape-particle';
      const angle = Math.random()*Math.PI*2, dist = rand(60,160);
      p.style.cssText = `left:${cx}px;top:${cy}px;
        --epc:${cols[randInt(0,cols.length)]};
        --ep-tx:${(Math.cos(angle)*dist).toFixed(0)}px;
        --ep-ty:${(Math.sin(angle)*dist).toFixed(0)}px;
        --ep-dur:${rand(0.7,1.5).toFixed(2)}s;
        --ep-del:${rand(0,0.3).toFixed(2)}s;
        width:${randInt(4,10)}px;height:${randInt(4,10)}px;`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 2000);
    }
  }

  function spawnButterflies(n){
    const emojis = ['🦋','🦋','✨','💜','🌸'];
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    for(let i=0;i<n;i++){
      const b = document.createElement('div');
      b.className = 'butterfly';
      const angle = Math.random()*Math.PI*2, dist = rand(80,280);
      b.textContent = emojis[randInt(0,emojis.length)];
      b.style.cssText = `left:${cx}px;top:${cy}px;
        --bf-tx:${(Math.cos(angle)*dist).toFixed(0)}px;
        --bf-ty:${(-80-rand(0,180)).toFixed(0)}px;
        --bf-rot:${rand(-30,30).toFixed(0)}deg;
        --bf-dur:${rand(2,4).toFixed(1)}s;
        --bf-del:${rand(0,0.5).toFixed(2)}s;
        font-size:${randInt(16,34)}px;`;
      bfCont.appendChild(b);
      setTimeout(()=>b.remove(), 4500);
    }
  }

  function spawnPaperBits(n){
    const cols = ['rgba(233,213,255,0.8)','rgba(253,230,138,0.7)','rgba(196,181,253,0.8)','rgba(255,255,255,0.7)'];
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    for(let i=0;i<n;i++){
      const p = document.createElement('div');
      p.className = 'paper-bit';
      const angle = Math.random()*Math.PI*2, dist = rand(60,220);
      p.style.cssText = `left:${cx}px;top:${cy-40}px;
        --pb-col:${cols[randInt(0,cols.length)]};
        --pb-tx:${(Math.cos(angle)*dist).toFixed(0)}px;
        --pb-ty:${(-60-rand(0,160)).toFixed(0)}px;
        --pb-rot:${rand(0,360).toFixed(0)}deg;
        --pb-dur:${rand(1.5,3).toFixed(1)}s;
        --pb-del:${rand(0,0.4).toFixed(2)}s;
        width:${randInt(8,22)}px;height:${randInt(6,16)}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 3500);
    }
  }

  /* ════════════════════════════════════
     MEMORY WALL — init (called on swap)
  ════════════════════════════════════ */
  const MEMORIES = [
    {
      id:'slot-1', src:'images/photos/baby-birthday-poster.jpg',
      caption:'Once upon a time... a little princess was born. 👶🎂',
      tape:'top-left', clip:'right', startDelay:1200,
      flyFrom:{x:0,y:220,rot:-15}, landRot:-2, hoverRot:-3, sparkles:true
    },
    {
      id:'slot-2', src:'images/photos/childhood-together.jpg',
      caption:'Partners in crime since day one. ❤️',
      tape:'top-right', clip:'left', startDelay:2600,
      flyFrom:{x:220,y:140,rot:12}, landRot:2, hoverRot:3, sparkles:true
    },
    {
      id:'slot-3', src:'images/photos/bw-selfie.jpg',
      caption:'Elegance never goes out of style. 🖤',
      tape:'bottom-left', clip:'top', startDelay:4000,
      flyFrom:{x:-220,y:-80,rot:-8}, landRot:-1.5, hoverRot:-2, sparkles:true, purpleGlow:true
    },
    {
      id:'slot-4', src:'images/photos/cat-filter-selfie.jpg',
      caption:'Cuteness level: 999+ 😼💜',
      tape:'bottom-right', clip:'right', startDelay:5500,
      flyFrom:{x:100,y:-160,rot:18}, landRot:1.5, hoverRot:2, sparkles:true, hearts:true
    }
  ];

  const LETTER_TEXT =
`Every picture tells a story...

But the best memories are
still waiting to happen.

Happy Birthday 💜`;

  function initMemoryWall(){
    buildMemEnv();

    // Show lights & decos
    setTimeout(()=>{
      document.getElementById('m-lights').classList.add('show');
      document.querySelectorAll('.mem-butterfly').forEach(b=>{ b.style.opacity='0.55'; });
      document.querySelectorAll('.sb-deco').forEach(d=>d.classList.add('show'));
    }, 800);

    // Fly in memories
    MEMORIES.forEach(mem=>{
      setTimeout(()=>revealMemory(mem), mem.startDelay);
    });

    // Final letter
    const lastDelay = MEMORIES[MEMORIES.length-1].startDelay + 2200;
    setTimeout(showFinalLetter, lastDelay);
  }

  function buildMemEnv(){
    // Lights
    const lc = ['#ff6b9d','#ffd700','#a78bfa','#67e8f9','#fb923c','#86efac'];
    const cnt = Math.max(10, Math.round(window.innerWidth/52));
    const ml  = document.getElementById('m-lights');
    for(let i=0;i<cnt;i++){
      const b = document.createElement('div');
      b.className = 'mem-bulb';
      const c = lc[i%lc.length];
      b.style.cssText = `--mbc:${c};background:${c};--mbd:${rand(2,5).toFixed(1)}s;animation-delay:${rand(0,2).toFixed(2)}s`;
      ml.appendChild(b);
    }
    // Stars
    const ms = document.getElementById('m-stars');
    for(let i=0;i<55;i++){
      const s = document.createElement('div');
      s.className='mem-star';
      s.style.cssText=`left:${rand(0,100)}%;top:${rand(0,85)}%;--msd:${rand(2,7).toFixed(1)}s;animation-delay:${rand(0,5).toFixed(2)}s;opacity:${rand(0.1,0.6).toFixed(2)};width:${Math.random()>0.7?'3px':'2px'};height:${Math.random()>0.7?'3px':'2px'}`;
      ms.appendChild(s);
    }
    // Particles
    const mc = ['rgba(167,139,250,0.55)','rgba(251,191,36,0.4)','rgba(233,213,255,0.5)','rgba(196,181,253,0.5)'];
    const mp = document.getElementById('m-particles');
    for(let i=0;i<25;i++){
      const p = document.createElement('div');
      p.className='mem-spark';
      const sz=rand(3,8).toFixed(1)+'px';
      p.style.cssText=`--msc:${mc[randInt(0,mc.length)]};--mss:${sz};width:${sz};height:${sz};left:${rand(0,100)}%;--msf:${rand(8,18).toFixed(1)}s;--msfd:${rand(0,10).toFixed(1)}s`;
      mp.appendChild(p);
    }
    // Butterflies
    const mb = document.getElementById('m-butterflies');
    const emj = ['🦋','🌸','✨','💜','🌷'];
    for(let i=0;i<7;i++){
      const b = document.createElement('div');
      b.className='mem-butterfly';
      b.textContent=emj[randInt(0,emj.length)];
      b.style.cssText=`
        left:${rand(5,90)}%;top:${rand(10,85)}%;
        --mbfd:${rand(4,9).toFixed(1)}s;
        --mbdx:${rand(-20,20).toFixed(0)}px;
        --mbdy:${rand(-15,15).toFixed(0)}px;
        animation-delay:${rand(0,4).toFixed(1)}s;
        font-size:${randInt(10,24)}px;
        opacity:0; transition:opacity 2s ease;`;
      mb.appendChild(b);
    }
  }

  function makeClipSVG(color){
    return `<svg class="clip-svg" viewBox="0 0 24 50" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2 C6 2,2 6,2 12 L2 42 C2 46,6 50,10 50 C14 50,18 46,18 42 L18 14 C18 10,15 7,12 7 C9 7,6 10,6 14 L6 38 C6 40,8 42,10 42 C12 42,14 40,14 38 L14 16"
        stroke="${color}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>`;
  }

  function revealMemory(mem){
    const slot = document.getElementById(mem.id);
    if(!slot) return;

    const polaroid = document.createElement('div');
    polaroid.className='polaroid';
    polaroid.style.setProperty('--ph-rot', mem.hoverRot+'deg');

    const img = document.createElement('img');
    img.src=mem.src; img.alt=mem.caption; img.loading='eager';

    const cap = document.createElement('p');
    cap.className='polaroid-caption'; cap.textContent=mem.caption;

    polaroid.appendChild(img);
    polaroid.appendChild(cap);

    const washi = document.createElement('div');
    washi.className=`washi washi--${mem.tape}`;
    polaroid.appendChild(washi);

    const clipWrap = document.createElement('div');
    clipWrap.className=`paper-clip paper-clip--${mem.clip}`;
    const clipCols = {right:'#9ca3af',left:'#6b7280',top:'#a78bfa'};
    clipWrap.innerHTML = makeClipSVG(clipCols[mem.clip]||'#9ca3af');
    polaroid.appendChild(clipWrap);

    polaroid.style.setProperty('--fly-sx', mem.flyFrom.x+'px');
    polaroid.style.setProperty('--fly-sy', mem.flyFrom.y+'px');
    polaroid.style.setProperty('--fly-sr', mem.flyFrom.rot+'deg');
    polaroid.style.setProperty('--fly-er', mem.landRot+'deg');
    polaroid.style.setProperty('--fly-dur','1.3s');
    polaroid.style.setProperty('--fly-del','0s');

    slot.appendChild(polaroid);

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        slot.style.opacity='1';
        slot.classList.add('flying');
      });
    });

    if(mem.purpleGlow){
      setTimeout(()=>{
        polaroid.style.boxShadow='0 0 30px rgba(139,92,246,0.6),0 4px 16px rgba(0,0,0,0.35)';
        setTimeout(()=>{ polaroid.style.boxShadow=''; },1500);
      },800);
    }
    if(mem.sparkles) setTimeout(()=>spawnMemSparkles(slot), 200);
    if(mem.hearts)   setTimeout(()=>spawnMemHearts(slot), 500);
  }

  function spawnMemSparkles(slot){
    const rect = slot.getBoundingClientRect();
    const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
    const emj = ['✨','⭐','💫','✦'];
    for(let i=0;i<12;i++){
      const sp = document.createElement('div');
      sp.className='mem-sparkle';
      const angle=Math.random()*Math.PI*2, dist=rand(30,110);
      sp.textContent=emj[randInt(0,emj.length)];
      sp.style.cssText=`left:${cx}px;top:${cy}px;
        --msp-tx:${(Math.cos(angle)*dist).toFixed(0)}px;
        --msp-ty:${(Math.sin(angle)*dist-60).toFixed(0)}px;
        --msp-dur:${rand(0.9,1.7).toFixed(1)}s;
        --msp-del:${rand(0,0.4).toFixed(2)}s;
        font-size:${randInt(10,22)}px;`;
      document.body.appendChild(sp);
      setTimeout(()=>sp.remove(),2000);
    }
  }

  function spawnMemHearts(slot){
    const rect=slot.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    for(let i=0;i<10;i++){
      const h=document.createElement('div');
      h.className='mem-heart'; h.textContent='💜';
      h.style.cssText=`left:${cx+rand(-30,30)}px;top:${cy}px;
        --hp-tx:${rand(-60,60).toFixed(0)}px;
        --hp-ty:${(-50-rand(0,80)).toFixed(0)}px;
        --hp-dur:${rand(1.2,2.2).toFixed(1)}s;
        --hp-del:${rand(0,0.5).toFixed(2)}s;`;
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),3000);
    }
  }

  /* ════════════════════════════════════
     FINAL LETTER
  ════════════════════════════════════ */
  function showFinalLetter(){
    const letter  = document.getElementById('final-letter');
    const textEl  = document.getElementById('letter-text');
    const heartEl = document.getElementById('heart-beat');
    const btn     = document.getElementById('continue-btn');

    letter.classList.add('show');

    setTimeout(()=>{
      typeWrite(textEl, LETTER_TEXT, 38, ()=>{
        textEl.classList.add('done');
        setTimeout(()=>{
          heartEl.classList.add('show');
          setTimeout(()=>{ btn.classList.add('show'); },700);
        },400);
      });
    },800);

    btn.addEventListener('click', ()=>{
      // Ripple
      const ripple = document.getElementById('btn-ripple');
      const rect   = btn.getBoundingClientRect();
      ripple.style.cssText=`width:${rect.width}px;height:${rect.width}px;left:${rect.left}px;top:${rect.top+rect.height/2-rect.width/2}px;`;
      ripple.classList.remove('rippling');
      void ripple.offsetWidth;
      ripple.classList.add('rippling');

      setTimeout(()=>{
        document.body.style.transition='opacity 0.8s ease';
        document.body.style.opacity='0';
        setTimeout(()=>{ window.location.href='chocolate.html'; },900);
      },200);
    });
  }

  function typeWrite(el, text, speed, onDone){
    el.textContent='';
    let i=0;
    (function tick(){
      if(i<text.length){
        el.textContent+=text[i++];
        setTimeout(tick, speed+rand(-15,15));
      } else if(onDone){ onDone(); }
    })();
  }

  /* Prevent scroll */
  document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  document.addEventListener('wheel',e=>e.preventDefault(),{passive:false});

})();
</script>
</body>
</html>
