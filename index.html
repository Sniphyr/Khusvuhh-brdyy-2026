<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Ready for the Surprise!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #timer-page {
            text-align: center;
            color: white;
            padding: 20px;
            max-width: 90%;
        }

        #timer-page h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin-bottom: clamp(20px, 4vh, 30px);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            word-wrap: break-word;
        }

        #timer {
            font-size: clamp(3rem, 12vw, 5rem);
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            padding: clamp(15px, 3vw, 20px);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: inline-block;
            min-width: min(250px, 80vw);
        }

        @media (max-width: 768px) {
            #timer-page h1 {
                font-size: 1.8rem;
            }
            
            #timer {
                font-size: 3.5rem;
            }
        }

        @media (max-width: 480px) {
            #timer-page h1 {
                font-size: 1.3rem;
                margin-bottom: 15px;
            }
            
            #timer {
                font-size: 2.5rem;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="timer-page">
        <h1>🎉 Get Ready for the Surprise! 🎂</h1>
        <div id="timer">00:30</div>
    </div>

    <script>
        // Countdown for 30 seconds
        function countdownFor30Seconds() {
            let remainingTime = 30; // Set the timer to 30 seconds

            const countdownInterval = setInterval(() => {
                if (remainingTime <= 0) {
                    clearInterval(countdownInterval); // Stop the timer
                    window.location.href = "intro.html"; // Redirect to the main birthday page
                    return;
                }

                // Calculate minutes and seconds
                const minutes = Math.floor(remainingTime / 60);
                const seconds = remainingTime % 60;

                // Display the timer
                document.getElementById('timer').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                remainingTime--; // Decrease the remaining time
            }, 1000);
        }

        // Start the countdown when the page loads
        countdownFor30Seconds();
    </script>
</body>
</html>
